<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MDM New Year 2083 - Master Gen</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Libre+Barcode+39&family=Playfair+Display:ital,wght@0,700;1,400&family=Montserrat:wght@300;400;700&display=swap');

        :root {
            --midnight: #0a0f1d;
            --deep-charcoal: #161e2e;
            --gold: #d4af37;
            --soft-gold: #f5e6ab;
            --white: #ffffff;
        }

        body { background: #020617; display: flex; flex-direction: column; align-items: center; padding: 40px; font-family: 'Montserrat', sans-serif; color: var(--white); min-height: 100vh; margin: 0; }
        
        /* FORM UI */
        .no-print-area { background: var(--deep-charcoal); padding: 30px; border-radius: 12px; border: 1px solid var(--gold); width: 600px; margin-bottom: 50px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .attendee-input { border-bottom: 1px solid #334155; padding: 20px 0; }
        label { display: block; color: var(--gold); font-size: 14px; font-weight: 700; margin-bottom: 5px; text-transform: uppercase; }
        input, select { width: 100%; padding: 14px; background: #020617; border: 1px solid #334155; color: white; border-radius: 6px; margin-bottom: 10px; font-size: 16px; box-sizing: border-box; }
        
        /* TICKETS */
        #ticket-wrapper { display: flex; flex-direction: column; align-items: center; gap: 40px; }
        .boarding-pass { 
            background: var(--midnight); width: 1400px; height: 550px; display: flex; 
            border-radius: 12px; overflow: hidden; border: 2px solid var(--gold); position: relative;
            -webkit-print-color-adjust: exact; print-color-adjust: exact;
        }

        .section { border-right: 1px dashed rgba(212, 175, 55, 0.4); display: flex; flex-direction: column; position: relative; }
        .main { width: 500px; padding: 35px; background: var(--midnight); display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .main-logo { height: 60px; width: 60px; object-fit: contain; }
        .event-title { font-family: 'Playfair Display', serif; font-size: 24px; text-align: center; font-weight: 700; }
        
        .passenger-name { font-size: 38px; font-weight: 700; text-transform: uppercase; border-bottom: 3px solid var(--gold); margin: 15px 0 10px 0; padding-bottom: 5px; letter-spacing: 1px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }
        .label { color: var(--gold); font-weight: 700; font-size: 12px; text-transform: uppercase; }
        .data { font-size: 18px; margin-top: 2px; font-weight: 400; }
        
        .itinerary-large { font-size: 12px; color: var(--gold); margin: 20px 0; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 6px; text-align: center; border: 1px solid rgba(212,175,55,0.3); font-weight: 700; }
        
        /* LOWER MAIN SECTION */
        .footer-main { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
        .qr-code { width: 90px; height: 90px; border: 2px solid var(--gold); background: white; padding: 4px; border-radius: 4px; }
        .partners-wrap { flex-grow: 1; }
        
        /* UPDATED 2x3 LOGO GRID */
        .pb-logos { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px; 
            align-items: center; 
            margin-top: 10px; 
        }
        .pb-logo { 
            height: 32px; 
            width: auto; 
            max-width: 85px; 
            object-fit: contain; 
            justify-self: center;
            background: transparent !important; 
            filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.5)); 
        }

        /* STUBS */
        .stub { width: 220px; text-align: center; background: var(--deep-charcoal); display: flex; flex-direction: column; }
        .stub-content { padding: 30px 15px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .stub-title { font-size: 18px; font-weight: 700; color: var(--white); margin: 10px 0; line-height: 1.2; }
        .barcode-1d { font-family: 'Libre Barcode 39'; font-size: 55px; color: var(--gold); opacity: 0.9; margin: 15px 0; }
        .bg-raffle-dark { background-color: #0d1117 !important; border-left: 2px solid var(--gold); }
        .stub .data { font-size: 15px; color: var(--white); opacity: 0.9; font-weight: 700; }

        /* BUTTONS */
        .controls-bottom { display: flex; gap: 20px; margin-top: 40px; margin-bottom: 60px; }
        .btn { padding: 18px 45px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; text-transform: uppercase; font-size: 16px; }
        .btn-gen { background: var(--gold); color: black; width: 100%; }
        .btn-print { background: #22c55e; color: white; }
        .btn-reset { background: #64748b; color: white; }

        .hidden { display: none !important; }

        @media print {
            .no-print-area, .controls-bottom { display: none !important; }
            body { padding: 0; background: white; }
            .boarding-pass { page-break-after: always; zoom: 0.50; margin-bottom: 40px; border: 1px solid #000; }
        }
    </style>
</head>
<body>

    <div class="no-print-area" id="setup-form">
        <h2 style="color: var(--gold); margin-top: 0; font-family: 'Playfair Display', serif; font-size: 28px;">Ticket Master Gen</h2>
        <label>Attendee Count</label>
        <input type="number" id="attendee-count" value="1" min="1" max="15" onchange="generateForm()">
        <div id="attendee-inputs-container"></div>
        <button class="btn btn-gen" onclick="renderTickets()">Generate Tickets</button>
    </div>

    <div id="ticket-wrapper"></div>

    <div id="bottom-actions" class="controls-bottom hidden">
        <button class="btn btn-print" onclick="window.print()">Print All Tickets</button>
        <button class="btn btn-reset" onclick="location.reload()">Create More / Reset</button>
    </div>

    <script>
        function generateForm() {
            const container = document.getElementById('attendee-inputs-container');
            const count = document.getElementById('attendee-count').value;
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                container.innerHTML += `
                    <div class="attendee-input">
                        <label>Attendee #${i+1} Name</label>
                        <input type="text" class="att-name" placeholder="ARYAL / SARAD" required>
                        <label>Contact Number</label>
                        <input type="text" class="att-phone" placeholder="98XXXXXXXX">
                        <label>Ticket Option</label>
                        <select class="att-option">
                            <option value="early">Early Departure (Transport + 2 Lunch)</option>
                            <option value="direct">Venue Direct (No Transport)</option>
                        </select>
                    </div>`;
            }
        }
        generateForm();

        function renderTickets() {
            const names = document.querySelectorAll('.att-name');
            const phones = document.querySelectorAll('.att-phone');
            const options = document.querySelectorAll('.att-option');
            const wrapper = document.getElementById('ticket-wrapper');
            wrapper.innerHTML = ''; 

            names.forEach((n, i) => {
                const name = n.value.toUpperCase() || "GUEST PASS";
                const phone = phones[i].value || "NOT PROVIDED";
                const option = options[i].value;
                const raffle = Math.floor(10000 + Math.random() * 89999);
                
                const transportLabel = option === "early" ? "KTM BUS (INC)" : "SELF ARRIVAL";
                const seatInfo = option === "early" ? `ZONE B / ${10+i}A` : "OPEN SEATING";

                wrapper.innerHTML += `
                <div class="boarding-pass">
                    <div class="section main">
                        <div class="header">
                            <img src="mdm.jpeg" class="main-logo">
                            <div class="event-info">
                                <div class="event-title">New Year Party 2083</div>
                                <div style="font-size:11px; color:var(--gold); font-weight:700; text-align:center;">MOTEL DU MUGLING | WANDERING TRAILS</div>
                            </div>
                            <img src="wt.jpeg" class="main-logo">
                        </div>
                        
                        <div class="passenger-name">${name}</div>
                        
                        <div class="grid">
                            <div><div class="label">Transport</div><div class="data">${transportLabel}</div></div>
                            <div><div class="label">Seat/Zone</div><div class="data">${seatInfo}</div></div>
                            <div><div class="label">Contact</div><div class="data">${phone}</div></div>
                            <div><div class="label">Event Date</div><div class="data">13 APR 2083</div></div>
                        </div>
                        
                        <div class="itinerary-large">POOL PARTY • BONFIRE • RIVER DIP • RAFTING • DJ SETS</div>
                        
                        <div class="footer-main">
                            <div class="partners-wrap">
                                <div class="label" style="font-size:10px;">Official Partners</div>
                                <div class="pb-logos">
                                    <img src="galaxy.png" class="pb-logo">
                                    <img src="project.png" class="pb-logo">
                                    <img src="wondering.png" class="pb-logo">
                                    <img src="shreeban.png" class="pb-logo">
                                    <img src="mdm.png" class="pb-logo">
                                    <img src="escapade.png" class="pb-logo">
                                </div>
                            </div>
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=TICKET-${raffle}" class="qr-code">
                        </div>
                    </div>

                    <div class="section stub"><div class="stub-content"><div class="label">Day 2</div><div class="stub-title">Farewell<br>Lunch</div><div style="font-size:35px">🥘</div><div class="barcode-1d">WLUNCH</div><div class="data">${name}</div></div></div>
                    <div class="section stub"><div class="stub-content"><div class="label">Day 2</div><div class="stub-title">Riverside<br>Breakfast</div><div style="font-size:35px">🍽️</div><div class="barcode-1d">DINNER</div><div class="data">${name}</div></div></div>
                    <div class="section stub"><div class="stub-content"><div class="label">Day 1</div><div class="stub-title">Riverside<br>Dinner</div><div style="font-size:35px">☕</div><div class="barcode-1d">BREAK</div><div class="data">${name}</div></div></div>
                    <div class="section stub bg-raffle-dark"><div class="stub-content"><div class="label">ENTRY ID</div><div class="stub-title">RAFFLE DRAW</div><div style="font-size:40px">🎟️</div><div style="color:var(--gold); font-weight:700; font-size:24px;">#${raffle}</div><div class="barcode-1d">R${raffle}</div></div></div>
                    <div class="section stub"><div class="stub-content"><div class="label">Day 1</div><div class="stub-title">Welcome<br>LUNCH</div><div style="font-size:35px">🍱</div><div class="barcode-1d">LUNCH2</div><div class="data">${name}</div></div></div>
                </div>`;
            });

            document.getElementById('setup-form').classList.add('hidden');
            document.getElementById('bottom-actions').classList.remove('hidden');
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
