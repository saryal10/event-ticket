<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MDM New Year 2083 - Master Gen</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Libre+Barcode+39&family=Playfair+Display:ital,wght@0,700;1,400&family=Montserrat:wght@300;400;700&display=swap');

        :root {
            --midnight: #0a0f1d;
            --deep-charcoal: #161e2e;
            --gold: #d4af37;
            --soft-gold: #f5e6ab;
            --white: #ffffff;
        }

        body { background: #020617; display: flex; flex-direction: column; align-items: center; padding: 40px; font-family: 'Montserrat', sans-serif; color: var(--white); min-height: 100vh; }
        
        /* FORM UI */
        .no-print-area { background: var(--deep-charcoal); padding: 30px; border-radius: 12px; border: 1px solid var(--gold); width: 600px; margin-bottom: 50px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .attendee-input { border-bottom: 1px solid #334155; padding: 20px 0; }
        label { display: block; color: var(--gold); font-size: 11px; font-weight: 700; margin-bottom: 5px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; background: #020617; border: 1px solid #334155; color: white; border-radius: 6px; margin-bottom: 10px; box-sizing: border-box; }
        
        /* TICKETS */
        #ticket-wrapper { display: flex; flex-direction: column; align-items: center; gap: 40px; }
        .boarding-pass { 
            background: var(--midnight); width: 1400px; height: 480px; display: flex; 
            border-radius: 12px; overflow: hidden; border: 1px solid var(--gold); position: relative;
            -webkit-print-color-adjust: exact; print-color-adjust: exact;
        }

        .section { border-right: 1px dashed rgba(212, 175, 55, 0.2); display: flex; flex-direction: column; position: relative; }
        .main { width: 450px; padding: 25px; background: var(--midnight); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .main-logo { height: 45px; width: 45px; object-fit: contain; }
        .event-title { font-family: 'Playfair Display', serif; font-size: 16px; text-align: center; }
        .passenger-name { font-size: 26px; font-weight: 700; text-transform: uppercase; border-bottom: 2px solid var(--gold); margin: 15px 0 10px 0; padding-bottom: 5px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 10px; }
        .label { color: var(--gold); font-weight: 700; font-size: 9px; }
        .data { font-size: 12px; margin-top: 2px; }
        .itinerary-large { font-size: 10px; color: var(--gold); margin-top: 15px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 4px; text-align: center; border: 1px solid rgba(212,175,55,0.2); }
        
        /* SPONSORS FIX */
        .powered-by { margin-top: auto; padding-top: 10px; }
      /* SPONSORS FIX - REMOVE BACKGROUNDS */
.pb-logos {
    display: flex;
    gap: 12px; /* Slightly increased gap for better separation */
    align-items: center;
    margin-top: 5px;
    flex-wrap: wrap; /* Allows logos to wrap if needed on smaller screens */
}

.pb-logo {
    height: 35px; /* Fixed height for consistency */
    width: auto;  /* Width adjusts to maintain aspect ratio */
    max-width: 80px; /* Optional: prevents very wide logos from taking too much space */
    object-fit: contain; /* Ensures logo fits within bounds without stretching */
    background: transparent !important; /* Forces transparent background */
    padding: 0; /* Removes white padding */
    border-radius: 0; /* Optional: removes border radius since there's no box */
    filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.5)); /* Optional: adds a slight shadow for depth on dark background */
} 
        .qr-code { position: absolute; left: 20px; bottom: 85px; width: 65px; height: 65px; border: 1px solid var(--gold); background: white; padding: 2px; }

        /* STUBS */
        .stub { width: 190px; text-align: center; background: var(--deep-charcoal); display: flex; flex-direction: column; }
        .stub-content { padding: 20px 15px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .barcode-1d { font-family: 'Libre Barcode 39'; font-size: 40px; color: var(--gold); opacity: 0.8; }
        .bg-raffle-dark { background-color: #0d1117 !important; border-left: 1px solid var(--gold); }

        /* BUTTONS AT BOTTOM */
        .controls-bottom { display: flex; gap: 20px; margin-top: 40px; }
        .btn { padding: 15px 40px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        .btn-gen { background: var(--gold); color: black; width: 100%; }
        .btn-print { background: #22c55e; color: white; }
        .btn-reset { background: #64748b; color: white; }

        .hidden { display: none !important; }

        @media print {
            .no-print, .controls-bottom { display: none !important; }
            .boarding-pass { page-break-after: always; zoom: 0.55; margin-bottom: 20px; }
        }
    </style>
</head>
<body>

    <div class="no-print-area" id="setup-form">
        <h2 style="color: var(--gold); margin-top: 0;">Ticket Generator</h2>
        <label>Attendee Count</label>
        <input type="number" id="attendee-count" value="1" min="1" max="15" onchange="generateForm()">
        <div id="attendee-inputs-container"></div>
        <button class="btn btn-gen" onclick="renderTickets()">Generate Tickets</button>
    </div>

    <div id="ticket-wrapper"></div>

    <div id="bottom-actions" class="controls-bottom hidden">
        <button class="btn btn-print" onclick="window.print()">Print All Tickets</button>
        <button class="btn btn-reset" onclick="location.reload()">Create More / Reset</button>
    </div>

    <script>
        function generateForm() {
            const container = document.getElementById('attendee-inputs-container');
            const count = document.getElementById('attendee-count').value;
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                container.innerHTML += `
                    <div class="attendee-input">
                        <label>Attendee #${i+1} Name</label>
                        <input type="text" class="att-name" placeholder="E.g. ARYAL / SARAD" required>
                        <label>Contact Number</label>
                        <input type="text" class="att-phone" placeholder="98XXXXXXXX">
                    </div>`;
            }
        }
        generateForm();

        function renderTickets() {
            const names = document.querySelectorAll('.att-name');
            const phones = document.querySelectorAll('.att-phone');
            const wrapper = document.getElementById('ticket-wrapper');
            wrapper.innerHTML = ''; 

            names.forEach((n, i) => {
                const name = n.value.toUpperCase() || "GUEST";
                const phone = phones[i].value || "N/A";
                const raffle = Math.floor(10000 + Math.random() * 90000);

                wrapper.innerHTML += `
                <div class="boarding-pass">
                    <div class="section main">
                        <div class="header">
                            <img src="mdm.jpeg" class="main-logo">
                            <div class="event-info">
                                <div class="event-title">New Year Party 2083</div>
                                <div style="font-size:8px; color:var(--gold)">MOTEL DU MUGLING | WANDERING TRAILS</div>
                            </div>
                            <img src="wt.jpeg" class="main-logo">
                        </div>
                        <div class="passenger-name">${name}</div>
                        <div class="grid">
                            <div><div class="label">Route</div><div class="data">KTM ➔ MUGLING</div></div>
                            <div><div class="label">Seat</div><div class="data">B1 / ${10+i}A</div></div>
                            <div><div class="label">Departure</div><div class="data">13 APR | 09:00 AM</div></div>
                            <div><div class="label">Contact</div><div class="data">${phone}</div></div>
                        </div>
                        <div class="itinerary-large">POOL PARTY • BONFIRE • RIVER DIP • RAFTING • DJ SETS</div>
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=MDM${raffle}" class="qr-code">
                        
                        <div class="powered-by">
                            <div class="label" style="font-size:7px; margin-bottom:5px">Powered By</div>
                            <div class="pb-logos">
                                <img src="galaxy.jpeg" class="pb-logo">
                                <img src="project.jpeg" class="pb-logo">
                                <img src="wondering.png" class="pb-logo">
                                <img src="shreeban.jpeg" class="pb-logo">
                                <img src="mdm.png" class="pb-logo">
                                <img src="escapade.jpeg" class="pb-logo">
                            </div>
                        </div>
                    </div>

                    <div class="section stub"><div class="stub-content"><div class="label">Day 2</div><div class="stub-title">FAREWELL LUNCH</div><div style="font-size:24px">🍱</div><div class="barcode-1d">FAREWELL</div><div class="data">${name}</div></div></div>
                    <div class="section stub"><div class="stub-content"><div class="label">Day 2</div><div class="stub-title">BREAKFAST</div><div style="font-size:24px">☕</div><div class="barcode-1d">RBREAK</div><div class="data">${name}</div></div></div>
                    <div class="section stub"><div class="stub-content"><div class="label">Day 1</div><div class="stub-title">BBQ & DINNER</div><div style="font-size:24px">🍽️</div><div class="barcode-1d">BBQDNR</div><div class="data">${name}</div></div></div>
                    <div class="section stub bg-raffle-dark"><div class="stub-content"><div class="label">Lucky Draw</div><div class="stub-title">RAFFLE</div><div style="font-size:24px">🎟️</div><div style="color:var(--gold)">#0${raffle}</div><div class="barcode-1d">RAF${raffle}</div></div></div>
                    <div class="section stub"><div class="stub-content"><div class="label">Day 1</div><div class="stub-title">WELCOME LUNCH</div><div style="font-size:24px">🥘</div><div class="barcode-1d">WLUNCH</div><div class="data">${name}</div></div></div>
                </div>`;
            });

            document.getElementById('setup-form').classList.add('hidden');
            document.getElementById('bottom-actions').classList.remove('hidden');
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
